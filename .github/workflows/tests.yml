name: Run Tests

on:
  push:
    branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v3
            - uses: actions/setup-python@v4
              with:
                python-version: "3.14"
            - name: Install dependencies
              run: python -m pip install -r requirements.txt
            - name: Run Tests
              run: python -m pytest